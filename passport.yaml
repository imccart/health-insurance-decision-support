# Passport for numeric claim provenance.
# One entry per numeric claim in the manuscript prose (paper.tex, then appendix.tex).
# Audited by /review-numbers; never re-runs scripts.
# UNVERIFIED with an explanation marks externally sourced numbers and numbers
# derived from several artifact values; the explanation gives the source or arithmetic.

passport_version: 1
paper: health-insurance-decision-support

claims:

  # === Abstract ===

  - id: abs-dominated-pct-reduction
    claim: "enrollees are 42% less likely to select a dominated plan when using decision assistance"
    location: "Abstract, paper.tex"
    script: code/analysis/rf1_dominated.R
    artifact: results/dominated_att.csv
    artifact_key: "row=Any Assistance,col=ATT"
    expected_value: 0.42
    tolerance: 0.005
    status: PASS
    explanation: "Derived: -ATT / Predicted_rate in results/dominated_att.csv, row Any Assistance = 0.0155740 / 0.0372714 = 0.418. Prose reports it as a percent."
    last_verified: 2026-09-25

  - id: abs-comm-prem-ratio
    claim: "a $1 increase in monthly commissions ... as much as a $1.47 reduction in net monthly premiums"
    location: "Abstract, paper.tex (macro commPremRatio)"
    script: code/analysis/sum2_results.R
    artifact: results/tables/paper-numbers.tex
    artifact_key: 'regex:\\newcommand\{\\commPremRatio\}\{([-0-9.,]+)\}'
    expected_value: 1.47
    tolerance: 0.005
    status: PASS
    explanation:
    last_verified: 2026-09-25

  - id: abs-uninsured-tau0
    claim: "raises the uninsured share by 6.1 percentage points"
    location: "Abstract, paper.tex"
    script: code/analysis/sum2_results.R
    artifact: results/tables/counterfactual_results.tex
    artifact_key: 'regex:^Zero commission & 0\.00 & [-0-9.]+ & ([-0-9.]+)'
    expected_value: 6.1
    tolerance: 0.05
    status: PASS
    explanation:
    last_verified: 2026-09-25

