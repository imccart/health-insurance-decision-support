    expected_value: -47
    tolerance: 3
    status: PASS
    explanation: "Derived bound: largest |Delta V^obj| (central) among the commission-reshaping rows of counterfactual_results.tex (low uniform -47, aligned 7, flat-fee -16, scaled -43) is 47 < 50. The 0.75x uniform run (band low row) is -62, and at the high uninsured valuation low uniform is -69 and scaled -66 (counterfactual_welfare_band.tex), so the bound holds only for point runs at the central valuation."
    last_verified: 2026-09-25

